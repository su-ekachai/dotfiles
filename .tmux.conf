# ╔══════════════════════════════════════════════════════════════════╗
# ║ tmux configuration                                               ║
# ║ Prefix: Ctrl+A                                                   ║
# ║ Reload: prefix+r                                                 ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── General ────────────────────────────────────────────────────────

set -g default-terminal "screen-256color"    # Most compatible with TUI apps
set -ag terminal-overrides ",xterm-256color:RGB"  # Enable 24-bit color passthrough
set -as terminal-features 'xterm*:extkeys'   # Extended key reporting from outer terminal
set -g history-limit 50000                   # Scrollback lines (default: 2000)
set -g display-time 4000                     # Status messages visible for 4s
set -g mouse on                              # Enable mouse for scroll/resize/select
set -g focus-events on                       # Let editors detect pane focus changes
set -sg escape-time 10                       # Near-instant ESC response for vim/neovim
set -s extended-keys on                      # Pass Shift+Enter/Ctrl+Enter to apps (CSI u)
set -g allow-passthrough all                 # Allow passthrough but track per-pane state

# ── Prefix ─────────────────────────────────────────────────────────
# Remap prefix from Ctrl+B to Ctrl+A (closer to home row)

set -g prefix C-a
unbind C-b
bind C-a send-prefix                         # Send Ctrl+A to apps with prefix prefix

# ── Window/Pane Numbering ──────────────────────────────────────────

set -g base-index 1                          # Windows start at 1 (not 0)
set -g pane-base-index 1                     # Panes start at 1
set -g renumber-windows on                   # Re-number when a window is closed

# ── Splits ─────────────────────────────────────────────────────────
# All new panes/windows inherit the current working directory

unbind %
bind | split-window -h -c "#{pane_current_path}"   # prefix+|  → vertical split
unbind '"'
bind - split-window -v -c "#{pane_current_path}"   # prefix+-  → horizontal split
bind c new-window -c "#{pane_current_path}"        # prefix+c  → new window

# ── Pane Resize ────────────────────────────────────────────────────
# prefix+h/j/k/l resizes by 5 cells; -r allows repeat without prefix

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z                     # prefix+m  → toggle pane zoom

# ── Window Management ──────────────────────────────────────────────

bind -r "<" swap-window -d -t -1             # prefix+<  → move window left
bind -r ">" swap-window -d -t +1             # prefix+>  → move window right
bind Space last-window                       # prefix+Space → toggle last window

# ── Vi Copy Mode ───────────────────────────────────────────────────
# Enter copy mode: prefix+[    Navigate: hjkl    Quit: q

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection          # v → start selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'  # y → copy to clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'  # Mouse select → auto-copy to clipboard

# ── Reload ─────────────────────────────────────────────────────────

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Plugins (TPM) ─────────────────────────────────────────────────
# Install: prefix+I    Update: prefix+U    Remove: prefix+alt+u

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'  # Ctrl+hjkl moves between vim/tmux panes
set -g @vim_navigator_no_default_key_bindings 1  # Disable plugin's bindings (we define our own below)
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'     # Save/restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'     # Auto-save sessions every 15 min

set -g @themepack 'powerline/block/cyan'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'               # Auto-restore last session on tmux start

# TPM init
run '~/.tmux/plugins/tpm/tpm'

# ── Pane Navigation (after TPM to avoid being overwritten) ─────────
# Ctrl+hjkl navigates panes, but passes through to vim/claude/fzf
is_app="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|claude)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_app" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_app" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_app" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_app" 'send-keys C-l' 'select-pane -R'
