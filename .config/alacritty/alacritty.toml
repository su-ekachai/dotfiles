# ── Alacritty – matching Ghostty setup ─────────────────────────────
# Theme: Catppuccin Mocha
# Install theme: mkdir -p ~/.config/alacritty/catppuccin && curl -LO --output-dir ~/.config/alacritty/catppuccin https://raw.githubusercontent.com/catppuccin/alacritty/main/catppuccin-mocha.toml

import = ["~/.config/alacritty/catppuccin/catppuccin-mocha.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 8 }
decorations = "Full"
option_as_alt = "Both"
startup_mode = "Windowed"

[scrolling]
history = 10000

[font]
size = 12.5

[font.normal]
family = "MesloLGS NF"
style = "Regular"

[font.bold]
family = "MesloLGS NF"
style = "Bold"

[font.italic]
family = "MesloLGS NF"
style = "Italic"

[font.offset]
y = 1

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
  { key = "Return", mods = "Shift", chars = "
" },
  { key = "Return", mods = "Alt", chars = "
" },
]
