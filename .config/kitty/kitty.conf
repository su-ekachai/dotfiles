# ── Kitty – matching Ghostty setup ─────────────────────────────────
# Theme: Catppuccin Mocha
# Install theme: kitty +kitten themes --reload-in=all Catppuccin-Mocha

# General
term xterm-256color
shell_integration enabled

# Window
window_padding_width 8
macos_titlebar_color system
macos_option_as_alt yes
remember_window_size yes

# Scrollback
scrollback_lines 10000

# Font
font_family MesloLGS NF
bold_font MesloLGS NF Bold
italic_font MesloLGS NF Italic
bold_italic_font MesloLGS NF Bold Italic
font_size 12.5
adjust_line_height 110%

# Clipboard
copy_on_select clipboard
strip_trailing_spaces smart
clipboard_control write-clipboard write-primary read-clipboard

# Keyboard: Shift+Enter and Alt+Enter send \x0a
map shift+enter send_text all \x0a
map alt+enter send_text all \x0a

# Theme (Catppuccin Mocha)
# Run: kitty +kitten themes Catppuccin-Mocha
include current-theme.conf
